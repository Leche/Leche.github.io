<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이창협 — Product Designer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#ffffff; --text:#191919; --sub:#616161; --cap:#999999; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121416; --text:#f5f6f7; --sub:#a6adb5; --cap:#6b7076; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; padding:0 24px; }
  main { max-width:960px; margin:0 auto; width:100%; }
  .label { font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--cap); margin-bottom:16px; }
  h1 { font-size:clamp(32px,5vw,48px); font-weight:700; letter-spacing:-.02em; line-height:1.25; }
  p { margin-top:20px; font-size:17px; line-height:1.6; color:var(--sub); }
</style>
</head>
<body>
<main>
  <div class="label">Portfolio · Coming soon</div>
  <h1>이창협<br>Senior Product Designer</h1>
  <p>포트폴리오 사이트를 준비하고 있습니다.</p>
</main>
</body>
</html>
